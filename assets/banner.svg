<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">MetaTune</title>
  <desc id="desc">MetaTune — song metadata from six providers with zero configuration.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A14" />
      <stop offset="0.55" stop-color="#0E1730" />
      <stop offset="1" stop-color="#080C19" />
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56E1FF" />
      <stop offset="0.5" stop-color="#7C6CFF" />
      <stop offset="1" stop-color="#D45CFF" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#A9EAFF" />
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="0.5" stop-color="#818CF8" />
      <stop offset="1" stop-color="#E879F9" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.3" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.38" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#93A4FF" stroke-opacity="0.07" stroke-width="1" />
    </pattern>

    <clipPath id="frame">
      <rect width="1280" height="420" rx="36" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
  <!-- Background -->
  <rect width="1280" height="420" rx="36" fill="url(#bg)" />
  <rect width="1280" height="420" rx="36" fill="url(#grid)" />
  <ellipse cx="1100" cy="20" rx="340" ry="240" fill="url(#glowViolet)" />
  <ellipse cx="160" cy="420" rx="340" ry="230" fill="url(#glowCyan)" />
  <ellipse cx="640" cy="190" rx="430" ry="180" fill="url(#glowViolet)" opacity="0.35" />
  <rect x="1" y="1" width="1278" height="418" rx="35" fill="none" stroke="url(#border)" stroke-width="2" opacity="0.55" />

  <!-- Wordmark -->
  <text x="640" y="232" text-anchor="middle" font-family="Inter, 'Segoe UI', Lato, Arial, sans-serif" font-size="168" font-weight="800" letter-spacing="-5" fill="url(#textGrad)">MetaTune</text>
  <rect x="540" y="258" width="200" height="5" rx="2.5" fill="url(#accent)" opacity="0.9" />

  <!-- Tagline -->
  <text x="640" y="308" text-anchor="middle" font-family="Inter, 'Segoe UI', Lato, Arial, sans-serif" font-size="24" font-weight="500" fill="#AAB8DA">Six providers. Zero configuration. Zero dependencies.</text>

  <!-- Providers -->
  <g font-family="Inter, 'Segoe UI', Lato, Arial, sans-serif" font-size="16" font-weight="600">
    <!-- Spotify -->
    <rect x="233" y="344" width="110" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1" />
    <circle cx="253" cy="367" r="5.5" fill="#1DB954" />
    <text x="269" y="373" fill="#EAF0FF">Spotify</text>

    <!-- Apple Music -->
    <rect x="355" y="344" width="145" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1" />
    <circle cx="375" cy="367" r="5.5" fill="#FA2D48" />
    <text x="391" y="373" fill="#EAF0FF">Apple Music</text>

    <!-- Deezer -->
    <rect x="512" y="344" width="104" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1" />
    <circle cx="532" cy="367" r="5.5" fill="#A238FF" />
    <text x="548" y="373" fill="#EAF0FF">Deezer</text>

    <!-- Tidal -->
    <rect x="628" y="344" width="96" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1" />
    <circle cx="648" cy="367" r="5.5" fill="#00D9FF" />
    <text x="664" y="373" fill="#EAF0FF">Tidal</text>

    <!-- SoundCloud -->
    <rect x="736" y="344" width="140" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1" />
    <circle cx="756" cy="367" r="5.5" fill="#FF5500" />
    <text x="772" y="373" fill="#EAF0FF">SoundCloud</text>

    <!-- YouTube Music -->
    <rect x="888" y="344" width="160" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1" />
    <circle cx="908" cy="367" r="5.5" fill="#FF0033" />
    <text x="924" y="373" fill="#EAF0FF">YouTube Music</text>
  </g>

  <!-- Accents -->
  <circle cx="1214" cy="92" r="2.5" fill="#A5B4FC" opacity="0.8" />
  <circle cx="66" cy="344" r="2.5" fill="#67E8F9" opacity="0.8" />
  </g>
</svg>
