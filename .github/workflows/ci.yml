name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build and runtime smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Smoke test (Bun)
        run: |
          bun --eval "const m = await import('./dist/index.js'); const names = ['Spotify', 'Deezer', 'AppleMusic', 'Tidal', 'SoundCloud', 'YTMusic']; if (!names.every((name) => typeof m[name]?.search === 'function')) throw new Error('Invalid exports');"

      - name: Smoke test (Node.js)
        run: |
          node --input-type=module -e "const m = await import('./dist/index.js'); const names = ['Spotify', 'Deezer', 'AppleMusic', 'Tidal', 'SoundCloud', 'YTMusic']; if (!names.every((name) => typeof m[name]?.search === 'function')) throw new Error('Invalid exports');"

      - name: Smoke test (Deno)
        run: |
          deno eval "const m = await import('./dist/index.js'); const names = ['Spotify', 'Deezer', 'AppleMusic', 'Tidal', 'SoundCloud', 'YTMusic']; if (!names.every((name) => typeof m[name]?.search === 'function')) throw new Error('Invalid exports');"

      - name: Validate package
        run: |
          npm pack --dry-run
          npx --yes publint
